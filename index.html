const salt = "KjTfCXbKA3OEUdiAENX4BA==";
const nonce = "D2QtyaapvC3eoVtP";

async function deriveKey(password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)), iterations:100000, hash:"SHA-256"},
    keyMaterial, {name:"AES-GCM", length:256}, false, ["decrypt"]
  );
}

async function decrypt() {
  const pwd = document.getElementById("pwd").value;
  try {
    const key = await deriveKey(pwd);
    const encBytes = Uint8Array.from(atob(enc), c=>c.charCodeAt(0));
    const nonceBytes = Uint8Array.from(atob(nonce), c=>c.charCodeAt(0));
    const decrypted = await crypto.subtle.decrypt({name:"AES-GCM", iv:nonceBytes}, key, encBytes);
    const html = new TextDecoder().decode(decrypted);
    document.getElementById("prompt").classList.add("hidden");
    const c = document.getElementById("content");
    c.innerHTML = html;
    // Execute scripts in the injected HTML
    c.querySelectorAll("script").forEach(s => {
      const ns = document.createElement("script");
      ns.textContent = s.textContent;
      s.replaceWith(ns);
    });
    c.classList.remove("hidden");
  } catch(e) {
    document.getElementById("err").textContent = "密码错误，请重试";
  }
}
document.getElementById("pwd").addEventListener("keypress", e => { if(e.key==="Enter") decrypt(); });
